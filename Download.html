<!DOCTYPE html>
<html>
<head>
    <title>Download Wano</title>
</head>
<body>
    <h1>Download Wano 5.0.0</h1>
    <button onclick="downloadWano()">Download Wano</button>
    <p id="status"></p>

    <script>
        async function downloadWano() {
            const status = document.getElementById("status");
            status.textContent = "Downloading Wano...";

            try {
                const response = await fetch(
                    "https://mdbcar-services-server1.tail2a4cdb.ts.net/wano.pyw"
                );

                if (!response.ok) {
                    throw new Error("Download failed");
                }

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");

                a.href = url;
                a.download = "wano.pyw";
                document.body.appendChild(a);
                a.click();
                a.remove();

                setTimeout(() => URL.revokeObjectURL(url), 60000);
                status.textContent = "Download ready!";
            } catch (error) {
                status.textContent = "Error: " + error.message;
            }
        }
    </script>
</body>
</html>
